services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      # Apache listens on the container's internal port. Render supplies its
      # own PORT at runtime; local Compose must explicitly keep Apache on 80
      # so the host mapping above reaches it.
      PORT: ${WORDPRESS_CONTAINER_PORT:-80}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-http://localhost:8080}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-change-me-admin}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WOOCOMMERCE_INSTALL: ${WOOCOMMERCE_INSTALL:-0}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-}
      WOOCOMMERCE_CURRENCY: ${WOOCOMMERCE_CURRENCY:-JMD}
      WOOCOMMERCE_SEED: ${WOOCOMMERCE_SEED:-0}
      WOOCOMMERCE_SEED_CSV: ${WOOCOMMERCE_SEED_CSV:-/opt/izelena/scripts/sales-catalogue-import.csv}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wordpress.htaccess:/var/www/html/.htaccess

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${WORDPRESS_DB_USER:-wordpress}
      PMA_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}

volumes:
  db_data:
  wordpress_data:
