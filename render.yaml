services:
  - type: web
    name: izelena-foods
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
      - key: WORDPRESS_SITE_URL
        value: https://izelena-foods.onrender.com
      - key: WORDPRESS_SITE_TITLE
        value: Izelena Foods
      - key: WORDPRESS_ADMIN_USER
        value: izelena-admin
      - key: WORDPRESS_ADMIN_PASSWORD
        generateValue: true
      - key: WORDPRESS_ADMIN_EMAIL
        value: info@izelenafoods.com
      - key: WOOCOMMERCE_INSTALL
        value: "1"
      - key: WOOCOMMERCE_VERSION
        value: "11.0.0"
      - key: WOOCOMMERCE_CURRENCY
        value: JMD
      - key: WOOCOMMERCE_SEED
        value: "1"
      - key: WOOCOMMERCE_PUBLISH_SEED
        value: "1"
      - key: WOOCOMMERCE_PUBLISH_SLUGS
        value: jerk-seasoning,jerk-bbq-sauce,mango-salsa,spicy-mango-salsa,sorrel-pepper-sauce
